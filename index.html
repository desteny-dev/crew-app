<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" />
    <!-- Runde 6 (B3): Die Start-Hülle unten zeigt den Schriftzug „crew." in Bricolage. Ohne
         Vorladen zeichnet der Browser ihn erst in der Systemschrift und tauscht sie danach —
         genau das sichtbare Zusammenruckeln, das nicht sein soll. -->
    <link rel="preload" href="./fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/InstrumentSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Crew</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./icons/favicon-32-dunkel.png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crew" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      /* Runde 6 (B3, Jonathan: „dort soll man auch darauf achten das es immer in der richtigen
         farbe ladet"): Welches Thema gilt, weiß erst das Repository — und das steht frühestens
         nach dem ersten Modul. Bis dahin wäre die Seite hell, auch bei einer dunklen App: ein
         weißer Blitz vor dunklem Grund. Deshalb merkt sich die App das zuletzt gültige Thema
         (derselbe Schlüssel wie in web/ui/laden.js) und setzt es hier, vor dem ersten Bild. */
      (function () {
        try {
          var gemerkt = localStorage.getItem('crew.lade.thema');
          var dunkel = gemerkt === 'dark'
            || (!gemerkt && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!dunkel) return;
          document.documentElement.dataset.theme = 'dark';
          var farbe = document.querySelector('meta[name="theme-color"]');
          if (farbe) farbe.setAttribute('content', '#1a1816');
        } catch (e) { /* privates Fenster: dann eben hell */ }
      })();
    </script>
  </head>
  <body>
    <!-- Runde 6 (B3): Diese Fläche steht im ERSTEN Bild, ohne dass ein Skript gelaufen ist —
         gleiche Papierfarbe, gleiche Rundung, gleiche Breite wie der Rahmen danach. Sie fasst
         nichts an (pointer-events:none) und wird von app.js entfernt, sobald wirklich gezeichnet
         wurde. Aussehen und Klassen kommen aus web/styles.css (.p5-start, von P5). -->
    <div id="start-huelle" class="p5-start" data-role="app-start" role="status" aria-label="Crew startet" style="pointer-events:none">
      <div class="p5-start-flaeche">
        <div class="p5-start-mitte">
          <svg class="crew-lademarke" width="74" height="74" viewBox="2 2 68 68" aria-hidden="true"><mask id="crew-lade-luecke" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72"><rect x="0" y="0" width="72" height="72" fill="#fff"></rect><circle cx="53.5" cy="52" r="11.5" fill="#000"></circle></mask><circle cx="36" cy="36" r="24" fill="none" stroke="currentColor" stroke-width="7" mask="url(#crew-lade-luecke)"></circle><circle cx="53.5" cy="52" r="9.5" fill="var(--green)"></circle></svg>
        </div>
      </div>
    </div>
    <main id="app" aria-live="polite"></main>
    <!-- Vom Server erzeugt (scripts/serve.mjs): wählt Demo- oder Server-Modus. Fehlt die
         Datei, bleibt es beim Demo-Modus — die App läuft auch als reine Dateisammlung. -->
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
